[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "better-alarm"
version = "1.1.0"
description = "A terminal alarm clock you talk to in plain English — zero dependencies"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Vaibhav Singhvi" }]
# zero dependencies on macOS/Linux; Windows ships no IANA tz database,
# so zoneinfo needs the tzdata package there (used only by --tz)
dependencies = ["tzdata; platform_system == 'Windows'"]
keywords = ["alarm", "clock", "timer", "reminder", "terminal", "cli", "pomodoro"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Operating System :: MacOS",
    "Operating System :: POSIX :: Linux",
    "Operating System :: Microsoft :: Windows",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Utilities",
]

[project.optional-dependencies]
rich = ["rich>=13"]
dev = ["pytest>=8"]

[project.scripts]
alarm = "betteralarm.cli:main"

[tool.setuptools]
packages = ["betteralarm"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
